      <image href="https://skillicons.dev/icons?i=spring" x="50" y="10" width="40" height="40" />
      <image href="https://skillicons.dev/icons?i=postgres" x="100" y="10" width="40" height="40" />
      <image href="https://skillicons.dev/icons?i=kafka" x="150" y="10" width="40" height="40" />
      <image href="https://skillicons.dev/icons?i=docker" x="200" y="10" width="40" height="40" />
      <image href="https://skillicons.dev/icons?i=ts" x="250" y="10" width="40" height="40" />
      <image href="https://skillicons.dev/icons?i=go" x="300" y="10" width="40" height="40" />
      <image href="https://skillicons.dev/icons?i=python" x="350" y="10" width="40" height="40" />
